<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ゆりいか タスク管理</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root{
  --navy:#1F3864;--navy2:#2a4a82;--navyp:#e8edf5;
  --acc:#4a90c4;--accs:#d0e4f5;
  --grn:#4caf7d;--grns:#e8f5ee;
  --amb:#f0a030;--ambs:#fdf3e0;
  --red:#e05555;--reds:#fdeaea;
  --bg:#f5f7fa;--card:#fff;--bdr:#dde3ed;
  --tx:#1a1f2e;--txs:#6b7490;--txm:#9ea8bc;
  --sh:0 2px 8px rgba(31,56,100,.08);--r:12px;--rs:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;}
.page{display:none;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}

.hd{background:var(--navy);color:#fff;padding:16px 20px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(31,56,100,.25);flex-shrink:0;}
.hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.hd-title{font-size:17px;font-weight:700;}
.hd-title small{font-size:11px;font-weight:400;opacity:.7;display:block;margin-top:1px;}
.hd-back{display:flex;align-items:center;font-size:14px;font-weight:500;background:none;border:none;color:rgba(255,255,255,.85);cursor:pointer;padding:4px 0;}
.hd-back:active{opacity:.7;}
.hd-sub{font-size:16px;font-weight:700;color:#fff;}
.ic-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.ic-btn:active{background:rgba(255,255,255,.25);}
.date-bar{display:flex;align-items:center;gap:8px;}
.date-bdg{font-size:12px;font-weight:500;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;}
.summ{font-size:11px;opacity:.7;margin-left:auto;}
.db-card{display:flex;align-items:center;gap:10px;margin:0 0 4px;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:var(--rs);border:1px solid rgba(255,255,255,.2);}
.db-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.db-dot.on{background:#4caf7d;box-shadow:0 0 6px #4caf7d;}
.db-dot.off{background:#9ea8bc;}
.db-lbl{font-size:11px;color:rgba(255,255,255,.85);font-weight:500;}

.main{padding:16px 14px 90px;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;}
.sec-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid var(--bdr);}
.sec-hd{display:flex;align-items:center;padding:14px 16px;cursor:pointer;user-select:none;gap:10px;transition:background .15s;}
.sec-hd:active{background:var(--navyp);}
.sec-ic{width:32px;height:32px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.c0{background:var(--navyp)}.c1{background:var(--grns)}.c2{background:var(--accs)}.c3{background:var(--ambs)}.c4{background:#f3e8ff}.c5{background:#fff0e8}
.sec-ttl{font-size:15px;font-weight:700;color:var(--navy);flex:1;}
.sec-cnt{font-size:11px;color:var(--txm);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--bdr);}
.chev{font-size:14px;color:var(--txm);transition:transform .2s;flex-shrink:0;}
.sec-card.open .chev{transform:rotate(180deg);}
.sec-bd{display:none;border-top:1px solid var(--bdr);}
.sec-card.open .sec-bd{display:block;}

.ti{display:flex;align-items:flex-start;padding:12px 16px;gap:10px;cursor:pointer;border-bottom:1px solid var(--bg);}
.ti:last-child{border-bottom:none;}
.ti:active{opacity:.8;}
.ti:nth-child(1){background:#f0f6ff}.ti:nth-child(2){background:#e8f1fd}.ti:nth-child(3){background:#e0ecfc}
.ti:nth-child(4){background:#d8e7fb}.ti:nth-child(5){background:#d0e2fa}.ti:nth-child(n+6){background:#c8ddf9}
.ti-body{flex:1;min-width:0;}
.ti-txt{font-size:13px;color:var(--tx);line-height:1.5;word-break:break-all;}
.ti-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap;}
.ti-date{font-size:10px;color:var(--txm);}
.ti-res{font-size:10px;color:var(--navy2);background:var(--navyp);padding:1px 7px;border-radius:8px;}
.ti-staff{font-size:10px;color:var(--txs);background:var(--grns);padding:1px 7px;border-radius:8px;}
.tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;flex-shrink:0;}
.ttodo{background:#e8f0ff;color:#3a5fc8}.twip{background:var(--ambs);color:#b87a00}.tdone{background:var(--grns);color:var(--grn)}
.add-s{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--acc);padding:8px 16px;cursor:pointer;background:none;border:none;font-family:inherit;border-bottom:1px solid var(--bdr);}
.add-s:active{opacity:.6;}
.empty{padding:20px;text-align:center;font-size:13px;color:var(--txm);}

.fab{position:fixed;bottom:20px;right:calc(50% - 228px);width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(31,56,100,.35);cursor:pointer;z-index:150;transition:transform .15s;}
.fab:active{transform:scale(.94);}

.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--bdr);display:flex;padding:8px 0;box-shadow:0 -4px 20px rgba(31,56,100,.08);z-index:200;}
.bitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;color:var(--txm);font-size:10px;font-weight:500;border:none;background:none;font-family:inherit;}
.bitem.active{color:var(--navy);}
.bic{font-size:20px;}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px;animation:sup .25s ease;max-height:90vh;overflow-y:auto;}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.knob{width:36px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 16px;}
.stitle{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:16px;}
.fg{margin-bottom:14px;}
.fl{font-size:12px;font-weight:500;color:var(--txs);margin-bottom:6px;display:block;}
.fi,.fs,.fta{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:14px;font-family:inherit;color:var(--tx);background:var(--bg);outline:none;transition:border-color .15s;}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--acc);background:#fff;}
.fta{min-height:90px;resize:none;line-height:1.6;}
.fta-sm{min-height:60px;}
.dw{position:relative;}
.dd{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:14px;color:var(--tx);background:var(--bg);min-height:44px;pointer-events:none;}
.dd .sun{color:#e05555;font-weight:700;}.dd .sat{color:#4a90c4;font-weight:700;}.dd .wk{color:var(--txs);font-weight:700;}
.dhi{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
.mact{display:flex;gap:10px;margin-top:6px;}
.bcnl{flex:1;padding:12px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:#fff;font-size:14px;font-family:inherit;color:var(--txs);cursor:pointer;}
.bsav{flex:2;padding:12px;border:none;border-radius:var(--rs);background:var(--navy);font-size:14px;font-family:inherit;color:#fff;font-weight:700;cursor:pointer;}
.bsav:active{background:var(--navy2);}
.bdel{flex:1;padding:12px;border:1.5px solid var(--red);border-radius:var(--rs);background:#fff;font-size:14px;font-family:inherit;color:var(--red);cursor:pointer;}

.smain{padding:16px 14px 90px;flex:1;overflow-y:auto;}
.slbl{font-size:11px;font-weight:700;color:var(--txm);letter-spacing:.08em;padding:0 4px 8px;margin-top:20px;display:block;}
.slbl:first-child{margin-top:0;}
.scard{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);overflow:hidden;margin-bottom:4px;}
.srow{display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--bg);}
.srow:last-child{border-bottom:none;}
.srow:active{background:var(--bg);}
.srlbl{flex:1;font-size:14px;font-weight:500;}
.srsub{font-size:12px;color:var(--txm);}
.sarr{font-size:14px;color:var(--txm);}

.mmain{padding:16px 14px 90px;flex:1;overflow-y:auto;}
.mcard{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px;}
.mitem{display:flex;align-items:center;padding:12px 14px 12px 8px;gap:10px;border-bottom:1px solid var(--bg);}
.mitem:last-child{border-bottom:none;}
.mibody{flex:1;min-width:0;}
.minm{font-size:14px;font-weight:600;}
.misub{font-size:12px;color:var(--txm);margin-top:2px;}
.miact{display:flex;gap:6px;flex-shrink:0;}
.abtn{width:36px;height:36px;border-radius:var(--rs);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.abtn:active{opacity:.6;}
.aedt{background:var(--navyp);}
.adel{background:var(--reds);}
.add-card{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--card);border:2px dashed var(--bdr);border-radius:var(--r);color:var(--acc);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;margin-bottom:12px;}
.add-card:active{background:var(--accs);border-color:var(--acc);}
.ep{padding:24px;text-align:center;font-size:13px;color:var(--txm);}

.dh{display:flex;flex-direction:column;justify-content:center;gap:4px;width:28px;height:40px;padding:8px 6px;cursor:grab;flex-shrink:0;touch-action:none;opacity:.4;}
.dh:hover{opacity:.75;}
.dh span{display:block;height:2px;background:var(--tx);border-radius:2px;}
.dh:active{cursor:grabbing;opacity:1;}
.mitem.dragging{opacity:.3;background:var(--navyp);}
.mitem.ot{border-top:2.5px solid var(--acc);}
.mitem.ob{border-bottom:2.5px solid var(--acc);}

.tl-main{padding:0 0 90px;flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.tl-filter{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--bdr);}
.tl-filter::-webkit-scrollbar{display:none;}
.tl-chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--bdr);background:var(--card);color:var(--txs);font-family:inherit;flex-shrink:0;}
.tl-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.tl-scroll{flex:1;overflow-y:auto;padding:16px 14px 16px;}
.tl-day{margin-bottom:24px;}
.tl-dlbl{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.tl-dlbl::before,.tl-dlbl::after{content:'';flex:1;height:1px;background:var(--bdr);}
.tl-dtxt{font-size:12px;font-weight:700;color:var(--txm);white-space:nowrap;padding:0 4px;}
.tl-item{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px;cursor:pointer;border-left:3px solid var(--acc);}
.tl-item.stodo{border-left-color:#3a5fc8}.tl-item.swip{border-left-color:var(--amb)}.tl-item.sdone{border-left-color:var(--grn)}
.tl-item:active{opacity:.8;}
.tl-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;}
.tl-who{font-size:13px;font-weight:700;color:var(--navy);flex:1;min-width:0;}
.tl-fac{font-size:11px;color:var(--txm);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--bdr);flex-shrink:0;}
.tl-txt{font-size:13px;color:var(--tx);line-height:1.6;word-break:break-all;}
.tl-prog{font-size:12px;color:var(--txs);margin-top:4px;line-height:1.5;}
.tl-empty{padding:60px 20px;text-align:center;color:var(--txm);font-size:13px;}

.cal-main{display:flex;flex-direction:column;flex:1;overflow:hidden;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bdr);flex-shrink:0;}
.cal-nav-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--navyp);color:var(--navy);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn:active{background:var(--accs);}
.cal-month{font-size:16px;font-weight:700;color:var(--navy);}
.cal-scroll{flex:1;overflow-y:auto;padding-bottom:90px;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);}
.cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--txm);padding:8px 0;border-bottom:1px solid var(--bdr);}
.cal-dow.sun{color:var(--red);}.cal-dow.sat{color:var(--acc);}
.cal-day{min-height:58px;padding:4px;border-top:1px solid var(--bg);border-right:1px solid var(--bg);cursor:pointer;transition:background .15s;}
.cal-day:nth-child(7n){border-right:none;}
.cal-day:active{background:var(--navyp);}
.cal-day.other{opacity:.3;}
.cal-day.today .cal-dn{background:var(--navy);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin:0 auto;}
.cal-day.selected{background:var(--navyp);}
.cal-dn{font-size:12px;font-weight:500;text-align:center;margin-bottom:2px;color:var(--tx);}
.cal-dn.sun{color:var(--red);}.cal-dn.sat{color:var(--acc);}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;}
.cal-dot{width:6px;height:6px;border-radius:50%;}
.cal-sel{padding:14px 14px 0;}
.cal-sel-lbl{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:10px;}
.cal-task-item{background:var(--card);border-radius:var(--rs);border:1px solid var(--bdr);padding:12px 14px;margin-bottom:8px;cursor:pointer;border-left:3px solid var(--acc);}
.cal-task-item.stodo{border-left-color:#3a5fc8}.cal-task-item.swip{border-left-color:var(--amb)}.cal-task-item.sdone{border-left-color:var(--grn)}
.cal-task-txt{font-size:13px;color:var(--tx);margin-bottom:4px;}
.cal-task-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.cal-empty{padding:16px 0;text-align:center;font-size:12px;color:var(--txm);}
</style>
</head>
<body>

<!-- トップ -->
<div class="page active" id="pg-home">
  <header class="hd">
    <div class="hd-top">
      <div class="hd-title">ゆりいか タスク管理<small>Eureka Task Manager</small></div>
      <button class="ic-btn" id="btn-cfg1">⚙️</button>
    </div>
    <div class="db-card">
      <div class="db-dot off" id="db-dot"></div>
      <div class="db-lbl" id="db-lbl">データベース接続中…</div>
    </div>
    <div class="date-bar" style="margin-top:8px;">
      <div class="date-bdg" id="todayBadge">—</div>
      <div class="summ" id="taskSumm"></div>
    </div>
  </header>
  <main class="main" id="homeMain"></main>
  <button class="fab" id="fab-add">＋</button>
  <nav class="bbar">
    <button class="bitem active" id="bar-home1"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl1"><span class="bic">📰</span>TL</button>
    <button class="bitem" id="bar-cal1"><span class="bic">📅</span>カレンダー</button>
  </nav>
</div>

<!-- タイムライン -->
<div class="page" id="pg-tl">
  <header class="hd">
    <div class="hd-top">
      <div class="hd-title">タイムライン<small>TIMELINE</small></div>
      <button class="ic-btn" id="btn-cfg-tl">⚙️</button>
    </div>
  </header>
  <div class="tl-main">
    <div class="tl-filter" id="tl-filter"></div>
    <div class="tl-scroll"><div id="tl-body"></div></div>
  </div>
  <nav class="bbar">
    <button class="bitem" id="bar-home2"><span class="bic">📋</span>タスク</button>
    <button class="bitem active"><span class="bic">📰</span>TL</button>
    <button class="bitem" id="bar-cal2"><span class="bic">📅</span>カレンダー</button>
  </nav>
</div>

<!-- カレンダー -->
<div class="page" id="pg-cal">
  <header class="hd">
    <div class="hd-top">
      <div class="hd-title">カレンダー<small>CALENDAR</small></div>
      <button class="ic-btn" id="btn-cfg-cal">⚙️</button>
    </div>
  </header>
  <div class="cal-main">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="cal-prev">‹</button>
      <div class="cal-month" id="cal-month-lbl">—</div>
      <button class="cal-nav-btn" id="cal-next">›</button>
    </div>
    <div class="cal-scroll">
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-sel" id="cal-sel"></div>
    </div>
  </div>
  <button class="fab" id="fab-cal-add">＋</button>
  <nav class="bbar">
    <button class="bitem" id="bar-home7"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl7"><span class="bic">📰</span>TL</button>
    <button class="bitem active"><span class="bic">📅</span>カレンダー</button>
  </nav>
</div>

<!-- 設定 -->
<div class="page" id="pg-settings">
  <header class="hd">
    <div class="hd-top">
      <button class="hd-back" id="btn-cfg-back">← 戻る</button>
    </div>
    <div class="hd-sub">設定</div>
  </header>
  <div class="smain">
    <span class="slbl">管理</span>
    <div class="scard">
      <div class="srow" id="btn-to-fac">
        <span style="font-size:20px;">🏠</span>
        <div style="flex:1;"><div class="srlbl">施設管理</div><div class="srsub" id="fac-lbl">—</div></div>
        <span class="sarr">›</span>
      </div>
      <div class="srow" id="btn-to-staff">
        <span style="font-size:20px;">👥</span>
        <div style="flex:1;"><div class="srlbl">職員管理</div><div class="srsub" id="staff-lbl">—</div></div>
        <span class="sarr">›</span>
      </div>
      <div class="srow" id="btn-to-res">
        <span style="font-size:20px;">👤</span>
        <div style="flex:1;"><div class="srlbl">利用者管理</div><div class="srsub" id="res-lbl">—</div></div>
        <span class="sarr">›</span>
      </div>
    </div>
    <div style="text-align:center;margin-top:32px;font-size:11px;color:var(--txm);">ゆりいか タスク管理 v3.0</div>
  </div>
  <nav class="bbar">
    <button class="bitem" id="bar-home3"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl3"><span class="bic">📰</span>TL</button>
    <button class="bitem" id="bar-cal3"><span class="bic">📅</span>カレンダー</button>
  </nav>
</div>

<!-- 施設管理 -->
<div class="page" id="pg-fac">
  <header class="hd">
    <div class="hd-top">
      <button class="hd-back" id="btn-fac-back">← 設定</button>
      <div class="hd-sub">施設管理</div>
      <div style="width:80px;"></div>
    </div>
  </header>
  <div class="mmain">
    <button class="add-card" id="btn-add-fac">＋ 施設を追加</button>
    <div class="mcard" id="fac-list"></div>
  </div>
  <nav class="bbar">
    <button class="bitem" id="bar-home4"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl4"><span class="bic">📰</span>TL</button>
    <button class="bitem" id="bar-cal4"><span class="bic">📅</span>カレンダー</button>
  </nav>
</div>

<!-- 職員管理 -->
<div class="page" id="pg-staff">
  <header class="hd">
    <div class="hd-top">

<script>
(function(){
'use strict';

/* Firebase */
firebase.initializeApp({
  apiKey: "AIzaSyB-D90f-72b0lV2g0Ue6yc3-o30MBn6v0w",
  authDomain: "task-6e73b.firebaseapp.com",
  projectId: "task-6e73b",
  storageBucket: "task-6e73b.firebasestorage.app",
  messagingSenderId: "66320987902",
  appId: "1:66320987902:web:90a2cebd6c2d34661817af"
});
var db = firebase.firestore();

function setDbStatus(ok) {
  var dot = document.getElementById('db-dot');
  var lbl = document.getElementById('db-lbl');
  if (!dot || !lbl) return;
  dot.className = ok ? 'db-dot on' : 'db-dot off';
  lbl.textContent = ok ? 'データベース接続済み' : 'オフライン動作中';
}

/* ローカルストレージ */
var _m = {};
var ST = {
  get: function(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e) { return _m[k] || null; } },
  set: function(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} _m[k] = v; }
};
var K = { fac:'tt-fac', staff:'tt-staff', res:'tt-res', task:'tt-task' };

/* 初期データ */
function initData() {
  if (!ST.get(K.fac)) ST.set(K.fac, [
    {id:'all', name:'会社全体', order:0},
    {id:'h1',  name:'ハイム１', order:1},
    {id:'h2',  name:'ハイム２', order:2},
    {id:'soka',name:'草加駅前', order:3}
  ]);
  if (!ST.get(K.staff)) ST.set(K.staff, []);
  if (!ST.get(K.res))   ST.set(K.res, []);
  if (!ST.get(K.task))  ST.set(K.task, []);
}

function getFacs()  { return (ST.get(K.fac)  || []).sort(function(a,b){ return a.order - b.order; }); }
function getStaff() { return (ST.get(K.staff) || []).sort(function(a,b){ return (a.order||0) - (b.order||0); }); }
function getRes()   { return (ST.get(K.res)   || []).sort(function(a,b){ return (a.order||0) - (b.order||0); }); }
function getTasks() { return ST.get(K.task)   || []; }

/* Firebase: 設定取得 */
function fetchSettings(cb) {
  var done = false;
  var timer = setTimeout(function() { if (!done) { done = true; if (cb) cb(); } }, 5000);
  db.collection('settings').doc('data').get()
    .then(function(doc) {
      if (done) return;
      done = true; clearTimeout(timer);
      if (doc.exists) {
        var d = doc.data();
        if (d.fac   && d.fac.length)   ST.set(K.fac,   d.fac);
        if (d.staff && d.staff.length) ST.set(K.staff, d.staff);
        if (d.res   && d.res.length)   ST.set(K.res,   d.res);
      }
      if (cb) cb();
    })
    .catch(function() { if (!done) { done = true; clearTimeout(timer); if (cb) cb(); } });
}

/* Firebase: 設定保存 */
function saveSettings() {
  db.collection('settings').doc('data').set({
    fac: getFacs(), staff: getStaff(), res: getRes()
  }).catch(function(e) { console.warn('設定保存失敗', e); });
}

/* Firebase: タスク取得 */
function fetchTasks(cb) {
  db.collection('tasks').orderBy('createdAt', 'desc').get()
    .then(function(snap) {
      var tasks = [];
      snap.forEach(function(doc) { tasks.push(Object.assign({id: doc.id}, doc.data())); });
      ST.set(K.task, tasks);
      setDbStatus(true);
      if (cb) cb(tasks);
    })
    .catch(function(e) {
      console.warn('タスク取得失敗', e);
      setDbStatus(false);
      if (cb) cb(getTasks());
    });
}

/* Firebase: タスク保存 */
function saveTaskDB(t) {
  var fac   = getFacs().find(function(f)  { return f.id === t.fid; });
  var staff = t.staffId ? getStaff().find(function(s) { return s.id === t.staffId; }) : null;
  var res   = t.resId   ? getRes().find(function(r)   { return r.id === t.resId; })   : null;
  db.collection('tasks').doc(t.id).set({
    fid:       t.fid       || '',
    facName:   fac         ? fac.name   : '',
    resId:     t.resId     || '',
    resName:   res         ? res.name   : '',
    date:      t.date      || '',
    due:       t.due       || '',
    text:      t.text      || '',
    progress:  t.progress  || '',
    tag:       t.tag       || 'todo',
    staffId:   t.staffId   || '',
    staffName: staff       ? staff.name : '',
    createdAt: t.createdAt || new Date().toISOString()
  }).then(function() { setDbStatus(true); })
    .catch(function(e) { console.warn('タスク保存失敗', e); });
}

/* Firebase: タスク削除 */
function deleteTaskDB(id) {
  db.collection('tasks').doc(id).delete()
    .catch(function(e) { console.warn('タスク削除失敗', e); });
}

/* ユーティリティ */
var DOW = ['日','月','火','水','木','金','土'];
function uid()  { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n) { return n < 10 ? '0'+n : ''+n; }
function todayStr() { var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtD(s) {
  if (!s) return '';
  var p = s.split('-');
  var d = new Date(s+'T00:00:00');
  return parseInt(p[1])+'月'+parseInt(p[2])+'日（'+DOW[d.getDay()]+'）';
}
function fmtDFull(s) {
  var d = new Date(s+'T00:00:00');
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）';
}
function tL(t) { return {todo:'未着手', wip:'対応中', done:'対応済み'}[t] || t; }
function tC(t) { return {todo:'ttodo',  wip:'twip',   done:'tdone'}[t]   || 'ttodo'; }

function updateDD() {
  var v = document.getElementById('t-date').value;
  var el = document.getElementById('t-date-disp');
  if (!v) { el.textContent = ''; return; }
  var d = new Date(v+'T00:00:00'), dow = d.getDay();
  var p = v.split('-');
  var cls = dow===0 ? 'sun' : dow===6 ? 'sat' : 'wk';
  el.innerHTML = esc(p[0]+'/'+p[1]+'/'+p[2])+'<span class="'+cls+'">（'+DOW[dow]+'）</span>';
}
function updateDueDisp() {
  var v = document.getElementById('t-due').value;
  var el = document.getElementById('t-due-disp');
  if (!v) { el.textContent = ''; return; }
  var d = new Date(v+'T00:00:00'), dow = d.getDay();
  var p = v.split('-');
  var cls = dow===0 ? 'sun' : dow===6 ? 'sat' : 'wk';
  el.innerHTML = esc(p[0]+'/'+p[1]+'/'+p[2])+'<span class="'+cls+'">（'+DOW[dow]+'）</span>';
}
function onDueTypeChange() {
  var isDate = document.getElementById('due-type-date').checked;
  document.getElementById('due-date-wrap').style.display = isDate ? '' : 'none';
}

var ICONS = ['c0','c1','c2','c3','c4','c5'];

/* ページ切り替え */
function showPage(id) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  var fn = { 'pg-home':renderHome, 'pg-tl':renderTL, 'pg-cal':renderCal,
             'pg-settings':renderSettings, 'pg-fac':renderFac, 'pg-staff':renderStaff, 'pg-res':renderRes }[id];
  if (fn) fn();
}

/* モーダル */
function openOv(id)  { document.getElementById(id).classList.add('open'); }
function closeOv(id) { document.getElementById(id).classList.remove('open'); }
var _cfmCb = null;
function confirm2(msg, cb) { document.getElementById('cfm-msg').textContent = msg; _cfmCb = cb; openOv('ov-cfm'); }

/* トップ */
function renderHome() {
  var now = new Date(), dow = now.getDay();
  document.getElementById('todayBadge').textContent = (now.getMonth()+1)+'月'+now.getDate()+'日（'+DOW[dow]+'）';
  var cont = document.getElementById('homeMain');
  drawHome(cont, getTasks());
  fetchTasks(function(tasks) { drawHome(cont, tasks); });
}

function drawHome(cont, tasks) {
  var active = tasks.filter(function(t) { return t.tag !== 'done'; }).length;
  document.getElementById('taskSumm').textContent = '未完了 '+active+'件';
  var facs = getFacs(), staff = getStaff(), ress = getRes();
  cont.innerHTML = '';
  facs.forEach(function(fac, fi) {
    var ft = tasks.filter(function(t) { return t.fid === fac.id; });
    var card = document.createElement('div');
    card.className = 'sec-card';
    var html = '<button class="add-s" data-action="add-task" data-fid="'+fac.id+'">＋ タスクを追加</button>';
    if (ft.length) {
      html += ft.map(function(t) {
        var s = t.staffId ? staff.find(function(x) { return x.id === t.staffId; }) : null;
        var r = t.resId   ? ress.find(function(x)  { return x.id === t.resId; })   : null;
        var sN = s ? s.name : (t.staffName || '');
        var rN = r ? r.name : (t.resName   || '');
        return '<div class="ti" data-action="detail" data-id="'+t.id+'">' +
          '<div class="ti-body">' +
            '<div class="ti-txt">'+esc(t.text)+'</div>' +
            '<div class="ti-meta">' +
              '<span class="tag '+tC(t.tag)+'">'+tL(t.tag)+'</span>' +
              (rN ? '<span class="ti-res">'+esc(rN)+'</span>' : '') +
              (sN ? '<span class="ti-staff">'+esc(sN)+'</span>' : '') +
              '<span class="ti-date">'+fmtD(t.date)+'</span>' +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('');
    } else {
      html += '<div class="empty">タスクはありません</div>';
    }
    card.innerHTML =
      '<div class="sec-hd" data-toggle-sec>' +
        '<div class="sec-ic '+ICONS[fi%ICONS.length]+'">🏢</div>' +
        '<div class="sec-ttl">'+esc(fac.name)+'</div>' +
        '<div class="sec-cnt">'+ft.length+'件</div>' +
        '<div class="chev">▾</div>' +
      '</div>' +
      '<div class="sec-bd">'+html+'</div>';
    cont.appendChild(card);
  });
}

/* タイムライン */
var _tlF = 'all';
function renderTL() {
  var facs = getFacs(), staff = getStaff(), ress = getRes(), tasks = getTasks();
  var chips = [{id:'all', name:'すべて'}].concat(facs);
  document.getElementById('tl-filter').innerHTML = chips.map(function(f) {
    return '<button class="tl-chip'+(_tlF===f.id?' active':'')+'" data-action="tl-f" data-fid="'+f.id+'">'+esc(f.name)+'</button>';
  }).join('');
  var filtered = tasks.filter(function(t) { return _tlF==='all' || t.fid===_tlF; })
    .sort(function(a,b) { return b.date.localeCompare(a.date) || (b.createdAt||'').localeCompare(a.createdAt||''); });
  var body = document.getElementById('tl-body');
  if (!filtered.length) { body.innerHTML = '<div class="tl-empty">📭 タスクがまだありません</div>'; return; }
  var groups = {}, order = [];
  filtered.forEach(function(t) {
    if (!groups[t.date]) { groups[t.date] = []; order.push(t.date); }
    groups[t.date].push(t);
  });
  body.innerHTML = order.map(function(date) {
    var items = groups[date].map(function(t) {
      var fac    = facs.find(function(f)  { return f.id === t.fid; });
      var s      = t.staffId ? staff.find(function(x) { return x.id === t.staffId; }) : null;
      var r      = t.resId   ? ress.find(function(x)  { return x.id === t.resId; })   : null;
      var sN     = s ? s.name : (t.staffName || '');
      var rN     = r ? r.name : (t.resName   || '');
      var who    = rN ? rN : (fac ? fac.name : '—');
      var sub    = rN && fac ? fac.name : '';
      var dueStr = t.due ? fmtD(t.due) : '';
      return '<div class="tl-item s'+t.tag+'" data-action="detail" data-id="'+t.id+'">' +
        '<div class="tl-hd">' +
          '<div class="tl-who">'+esc(who)+
            (sub    ? ' <span style="font-size:11px;font-weight:400;color:var(--txm);">/ '+esc(sub)+'</span>' : '')+
            (dueStr ? ' <span style="font-size:11px;font-weight:400;color:var(--acc);">/ '+esc(dueStr)+'</span>' : '')+
          '</div>' +
          (sN ? '<div class="tl-fac" style="background:var(--grns);border-color:var(--grn);color:var(--grn);">'+esc(sN)+'</div>' : '') +
          '<span class="tag '+tC(t.tag)+'">'+tL(t.tag)+'</span>' +
        '</div>' +
        '<div class="tl-txt">'+esc(t.text)+'</div>' +
        (t.progress ? '<div class="tl-prog">📝 '+esc(t.progress)+'</div>' : '') +
      '</div>';
    }).join('');
    return '<div class="tl-day"><div class="tl-dlbl"><span class="tl-dtxt">'+fmtDFull(date)+'</span></div>'+items+'</div>';
  }).join('');
}

/* カレンダー */
var _calY   = new Date().getFullYear();
var _calM   = new Date().getMonth();
var _calSel = null;

function renderCal() {
  var today = new Date();
  var tasks = getTasks();
  document.getElementById('cal-month-lbl').textContent = _calY+'年'+(_calM+1)+'月';
  var dueMap = {};
  tasks.forEach(function(t) {
    if (!t.due) return;
    if (!dueMap[t.due]) dueMap[t.due] = [];
    dueMap[t.due].push(t);
  });
  var first = new Date(_calY, _calM, 1).getDay();
  var last  = new Date(_calY, _calM+1, 0).getDate();
  var DOWL  = ['日','月','火','水','木','金','土'];
  var html  = DOWL.map(function(d,i) {
    return '<div class="cal-dow'+(i===0?' sun':i===6?' sat':'')+'">' +d+'</div>';
  }).join('');
  for (var i = 0; i < first; i++) {
    html += '<div class="cal-day other"><div class="cal-dn"></div></div>';
  }
  for (var d = 1; d <= last; d++) {
    var ds   = _calY+'-'+pad(_calM+1)+'-'+pad(d);
    var dow  = new Date(_calY, _calM, d).getDay();
    var isT  = (_calY===today.getFullYear() && _calM===today.getMonth() && d===today.getDate());
    var isS  = _calSel === ds;
    var dt   = dueMap[ds] || [];
    var dnC  = 'cal-dn'+(dow===0?' sun':dow===6?' sat':'');
    var dayC = 'cal-day'+(isT?' today':'')+(isS?' selected':'');
    var dots = dt.slice(0,4).map(function(t) {
      var c = t.tag==='done'?'#4caf7d':t.tag==='wip'?'#f0a030':'#3a5fc8';
      return '<div class="cal-dot" style="background:'+c+'"></div>';
    }).join('');
    html += '<div class="'+dayC+'" data-action="cal-day" data-date="'+ds+'">' +
      '<div class="'+dnC+'">'+d+'</div>' +
      (dots ? '<div class="cal-dots">'+dots+'</div>' : '') +
    '</div>';
  }
  var total = first + last;
  var rem = total%7 ? 7-(total%7) : 0;
  for (var n = 1; n <= rem; n++) {
    html += '<div class="cal-day other"><div class="cal-dn"></div></div>';
  }
  document.getElementById('cal-grid').innerHTML = html;
  renderCalSel(dueMap);
}

function renderCalSel(dueMap) {
  var el = document.getElementById('cal-sel');
  if (!_calSel) { el.innerHTML = '<div class="cal-empty">日付をタップすると期日のタスクが表示されます</div>'; return; }
  var facs = getFacs(), staff = getStaff(), ress = getRes();
  var dm   = dueMap || {};

/* ドラッグソート */
function makeSortable(container, onReorder) {
  var dragging = null;
  function items() { return Array.from(container.querySelectorAll(':scope > .mitem')); }
  function clear() { items().forEach(function(el) { el.classList.remove('dragging','ot','ob'); }); }
  function onMove(y) {
    if (!dragging) return;
    var list = items().filter(function(el) { return el !== dragging; });
    clear(); dragging.classList.add('dragging');
    var placed = false;
    for (var i = 0; i < list.length; i++) {
      var r = list[i].getBoundingClientRect();
      if (y < r.top + r.height * 0.5) { container.insertBefore(dragging, list[i]); placed = true; break; }
    }
    if (!placed && list.length) container.appendChild(dragging);
  }
  function onEnd() {
    if (!dragging) return;
    clear();
    onReorder(items().map(function(el) { return el.dataset.id; }));
    dragging = null;
  }
  function attach(handle) {
    handle.addEventListener('touchstart', function(e) {
      e.stopPropagation(); e.preventDefault();
      dragging = handle.closest('.mitem'); dragging.classList.add('dragging');
      function mv(ev) { ev.preventDefault(); onMove(ev.touches[0].clientY); }
      function en() { onEnd(); document.removeEventListener('touchmove',mv); document.removeEventListener('touchend',en); }
      document.addEventListener('touchmove', mv, {passive:false});
      document.addEventListener('touchend', en);
    }, {passive:false});
    handle.addEventListener('mousedown', function(e) {
      e.stopPropagation(); e.preventDefault();
      dragging = handle.closest('.mitem'); dragging.classList.add('dragging');
      function mv(ev) { onMove(ev.clientY); }
      function en() { onEnd(); document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',en); }
      document.addEventListener('mousemove', mv);
      document.addEventListener('mouseup', en);
    });
  }
  container.querySelectorAll(':scope > .mitem > .dh').forEach(attach);
}

/* クリック委任 */
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('ov')) { e.target.classList.remove('open'); return; }
  var sh = e.target.closest('[data-toggle-sec]');
  if (sh) { sh.closest('.sec-card').classList.toggle('open'); return; }
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var act = btn.dataset.action, id = btn.dataset.id || '';
  if (act==='add-task')   { openTaskModal(btn.dataset.fid); return; }
  if (act==='detail')     { openDetail(id); return; }
  if (act==='edit-task')  { openEditTask(); return; }
  if (act==='edit-fac')   { openFacModal(id); return; }
  if (act==='del-fac')    { delFac(id); return; }
  if (act==='edit-staff') { openStaffModal(id); return; }
  if (act==='del-staff')  { delStaff(id); return; }
  if (act==='edit-res')   { openResModal(id); return; }
  if (act==='del-res')    { delRes(id); return; }
  if (act==='tl-f')       { _tlF = btn.dataset.fid; renderTL(); return; }
  if (act==='cal-day')    { _calSel = btn.dataset.date; renderCal(); return; }
});
