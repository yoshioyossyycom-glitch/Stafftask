<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ゆりいか タスク管理</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
:root {
  --navy:#1F3864; --navy2:#2a4a82; --navyp:#e8edf5;
  --acc:#4a90c4; --accs:#d0e4f5;
  --grn:#4caf7d; --grns:#e8f5ee;
  --amb:#f0a030; --ambs:#fdf3e0;
  --red:#e05555; --reds:#fdeaea;
  --bg:#f5f7fa; --card:#fff; --bdr:#dde3ed;
  --tx:#1a1f2e; --txs:#6b7490; --txm:#9ea8bc;
  --sh:0 2px 8px rgba(31,56,100,.08); --r:12px; --rs:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;max-width:480px;margin:0 auto;overflow-x:hidden;}
.page{display:none;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}

/* ヘッダー */
.hd{background:var(--navy);color:#fff;padding:16px 20px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(31,56,100,.25);flex-shrink:0;}
.hd-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.hd-title{font-size:17px;font-weight:700;}
.hd-title small{font-size:11px;font-weight:400;opacity:.7;display:block;margin-top:1px;}
.hd-back{display:flex;align-items:center;font-size:14px;font-weight:500;background:none;border:none;color:rgba(255,255,255,.85);cursor:pointer;padding:4px 0;}
.hd-back:active{opacity:.7;}
.hd-sub{font-size:16px;font-weight:700;color:#fff;}
.ic-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.ic-btn:active{background:rgba(255,255,255,.25);}
.date-bar{display:flex;align-items:center;gap:8px;}
.date-bdg{font-size:12px;font-weight:500;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;}
.summ{font-size:11px;opacity:.7;margin-left:auto;}

/* DBステータス */
.db-card{display:flex;align-items:center;gap:10px;margin:0 0 4px;padding:8px 12px;background:rgba(255,255,255,.12);border-radius:var(--rs);border:1px solid rgba(255,255,255,.2);}
.db-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.db-dot.connected{background:#4caf7d;box-shadow:0 0 6px #4caf7d;}
.db-dot.disconnected{background:#9ea8bc;}
.db-status{font-size:11px;color:rgba(255,255,255,.85);font-weight:500;}

/* メイン */
.main{padding:16px 14px 90px;display:flex;flex-direction:column;gap:10px;flex:1;overflow-y:auto;}

/* セクションカード */
.sec-card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid var(--bdr);}
.sec-hd{display:flex;align-items:center;padding:14px 16px;cursor:pointer;user-select:none;gap:10px;transition:background .15s;}
.sec-hd:active{background:var(--navyp);}
.sec-ic{width:32px;height:32px;border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.c0{background:var(--navyp);}.c1{background:var(--grns);}.c2{background:var(--accs);}.c3{background:var(--ambs);}.c4{background:#f3e8ff;}.c5{background:#fff0e8;}
.sec-ttl{font-size:15px;font-weight:700;color:var(--navy);flex:1;}
.sec-cnt{font-size:11px;color:var(--txm);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--bdr);}
.chev{font-size:14px;color:var(--txm);transition:transform .2s;flex-shrink:0;}
.sec-card.open .chev{transform:rotate(180deg);}
.sec-bd{display:none;border-top:1px solid var(--bdr);}
.sec-card.open .sec-bd{display:block;}

/* タスクアイテム */
.ti{display:flex;align-items:flex-start;padding:12px 16px;gap:10px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--bg);}
.ti:last-child{border-bottom:none;}
.ti:active{background:var(--bg);}
.ti:nth-child(1){background:#f0f6ff;}
.ti:nth-child(2){background:#e8f1fd;}
.ti:nth-child(3){background:#e0ecfc;}
.ti:nth-child(4){background:#d8e7fb;}
.ti:nth-child(5){background:#d0e2fa;}
.ti:nth-child(n+6){background:#c8ddf9;}
.ti-body{flex:1;min-width:0;}
.ti-txt{font-size:13px;color:var(--tx);line-height:1.5;word-break:break-all;}
.ti-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap;}
.ti-date{font-size:10px;color:var(--txm);}
.ti-res{font-size:10px;color:var(--navy2);background:var(--navyp);padding:1px 7px;border-radius:8px;}
.ti-assignee{font-size:10px;color:var(--txs);background:var(--grns);padding:1px 7px;border-radius:8px;}
.tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;flex-shrink:0;}
.t-todo{background:#e8f0ff;color:#3a5fc8;}
.t-wip{background:var(--ambs);color:#b87a00;}
.t-done{background:var(--grns);color:var(--grn);}
.add-s{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--acc);padding:8px 16px;cursor:pointer;background:none;border:none;font-family:inherit;border-bottom:1px solid var(--bdr);}
.add-s:active{opacity:.6;}
.empty{padding:20px;text-align:center;font-size:13px;color:var(--txm);}

/* FAB */
.fab{position:fixed;bottom:20px;right:calc(50% - 228px);width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;border:none;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(31,56,100,.35);cursor:pointer;z-index:150;transition:transform .15s;}
.fab:active{transform:scale(.94);}

/* ボトムバー */
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--bdr);display:flex;padding:8px 0;box-shadow:0 -4px 20px rgba(31,56,100,.08);z-index:200;}
.bitem{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;color:var(--txm);font-size:10px;font-weight:500;border:none;background:none;font-family:inherit;}
.bitem.active{color:var(--navy);}
.bic{font-size:20px;}

/* モーダル */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;align-items:flex-end;justify-content:center;}
.ov.open{display:flex;}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px;animation:sup .25s ease;max-height:90vh;overflow-y:auto;}
@keyframes sup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.knob{width:36px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 16px;}
.stitle{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:16px;}
.fg{margin-bottom:14px;}
.fl{font-size:12px;font-weight:500;color:var(--txs);margin-bottom:6px;display:block;}
.fi,.fs,.fta{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:14px;font-family:inherit;color:var(--tx);background:var(--bg);outline:none;transition:border-color .15s;}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--acc);background:#fff;}
.fta{min-height:90px;resize:none;line-height:1.6;}
.date-wrap{position:relative;}
.date-disp{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:var(--rs);font-size:14px;color:var(--tx);background:var(--bg);min-height:44px;pointer-events:none;}
.date-disp .dow-sun{color:#e05555;font-weight:700;}
.date-disp .dow-sat{color:#4a90c4;font-weight:700;}
.date-disp .dow-wk{color:var(--txs);font-weight:700;}
.date-input-hidden{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
.mact{display:flex;gap:10px;margin-top:6px;}
.bcnl{flex:1;padding:12px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:#fff;font-size:14px;font-family:inherit;color:var(--txs);cursor:pointer;}
.bsav{flex:2;padding:12px;border:none;border-radius:var(--rs);background:var(--navy);font-size:14px;font-family:inherit;color:#fff;font-weight:700;cursor:pointer;}
.bsav:active{background:var(--navy2);}
.bdel{flex:1;padding:12px;border:1.5px solid var(--red);border-radius:var(--rs);background:#fff;font-size:14px;font-family:inherit;color:var(--red);cursor:pointer;}

/* 設定 */
.smain{padding:16px 14px 90px;flex:1;overflow-y:auto;}
.slbl{font-size:11px;font-weight:700;color:var(--txm);letter-spacing:.08em;padding:0 4px 8px;margin-top:20px;display:block;}
.slbl:first-child{margin-top:0;}
.scard{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);overflow:hidden;margin-bottom:4px;}
.srow{display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--bg);}
.srow:last-child{border-bottom:none;}
.srow:active{background:var(--bg);}
.srlbl{flex:1;font-size:14px;font-weight:500;}
.srsub{font-size:12px;color:var(--txm);}
.sarr{font-size:14px;color:var(--txm);}

/* 管理 */
.mmain{padding:16px 14px 90px;flex:1;overflow-y:auto;}
.mcard{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);overflow:hidden;margin-bottom:12px;}
.mitem{display:flex;align-items:center;padding:12px 14px 12px 8px;gap:10px;border-bottom:1px solid var(--bg);}
.mitem:last-child{border-bottom:none;}
.mibody{flex:1;min-width:0;}
.minm{font-size:14px;font-weight:600;}
.misub{font-size:12px;color:var(--txm);margin-top:2px;}
.miact{display:flex;gap:6px;flex-shrink:0;}
.abtn{width:36px;height:36px;border-radius:var(--rs);border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;background:none;}
.abtn:active{opacity:.6;}
.aedt{background:var(--navyp);}
.adel{background:var(--reds);}
.add-card{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--card);border:2px dashed var(--bdr);border-radius:var(--r);color:var(--acc);font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;margin-bottom:12px;}
.add-card:active{background:var(--accs);border-color:var(--acc);}
.empty-page{padding:24px;text-align:center;font-size:13px;color:var(--txm);}

/* ドラッグ */
.dh{display:flex;flex-direction:column;justify-content:center;gap:4px;width:28px;height:40px;padding:8px 6px;cursor:grab;flex-shrink:0;touch-action:none;opacity:.4;}
.dh:hover{opacity:.75;}
.dh span{display:block;height:2px;background:var(--tx);border-radius:2px;}
.dh:active{cursor:grabbing;opacity:1;}
.mitem.dragging{opacity:.3;background:var(--navyp);}
.mitem.over-top{border-top:2.5px solid var(--acc);}
.mitem.over-bot{border-bottom:2.5px solid var(--acc);}

/* タイムライン */
.tl-main{padding:0 0 90px;flex:1;overflow-y:auto;display:flex;flex-direction:column;}
.tl-filter{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--bdr);}
.tl-filter::-webkit-scrollbar{display:none;}
.tl-chip{white-space:nowrap;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--bdr);background:var(--card);color:var(--txs);font-family:inherit;flex-shrink:0;}
.tl-chip.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.tl-scroll{flex:1;overflow-y:auto;padding:16px 14px 90px;}
.tl-day{margin-bottom:24px;}
.tl-day-lbl{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.tl-day-lbl::before,.tl-day-lbl::after{content:'';flex:1;height:1px;background:var(--bdr);}
.tl-day-txt{font-size:12px;font-weight:700;color:var(--txm);white-space:nowrap;padding:0 4px;}
.tl-item{background:var(--card);border-radius:var(--r);border:1px solid var(--bdr);box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px;cursor:pointer;border-left:3px solid var(--acc);}
.tl-item.status-todo{border-left-color:#3a5fc8;}
.tl-item.status-wip{border-left-color:var(--amb);}
.tl-item.status-done{border-left-color:var(--grn);}
.tl-item:active{opacity:.8;}
.tl-item-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.tl-who{font-size:13px;font-weight:700;color:var(--navy);flex:1;}
.tl-fac{font-size:11px;color:var(--txm);background:var(--bg);padding:2px 8px;border-radius:10px;border:1px solid var(--bdr);}
.tl-txt{font-size:13px;color:var(--tx);line-height:1.6;word-break:break-all;}
.tl-empty{padding:60px 20px;text-align:center;color:var(--txm);font-size:13px;}
</style>
</head>
<body>

<!-- トップページ -->
<div class="page active" id="pg-home">
  <header class="hd">
    <div class="hd-top">
      <div class="hd-title">ゆりいか タスク管理<small>YURIIKA TASK MANAGER</small></div>
      <button class="ic-btn" id="btn-cfg1">⚙️</button>
    </div>
    <div class="db-card">
      <div class="db-dot disconnected" id="db-dot"></div>
      <div class="db-status" id="db-status">データベース接続中…</div>
    </div>
    <div class="date-bar" style="margin-top:8px;">
      <div class="date-bdg" id="todayBadge">—</div>
      <div class="summ" id="taskSumm"></div>
    </div>
  </header>
  <main class="main" id="homeMain"></main>
  <button class="fab" id="fab-add">＋</button>
  <nav class="bbar">
    <button class="bitem active" id="bar-home1"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl1"><span class="bic">📰</span>タイムライン</button>
  </nav>
</div>

<!-- タイムラインページ -->
<div class="page" id="pg-tl">
  <header class="hd">
    <div class="hd-top">
      <div class="hd-title">タイムライン<small>TIMELINE</small></div>
      <button class="ic-btn" id="btn-cfg-tl">⚙️</button>
    </div>
  </header>
  <div class="tl-main">
    <div class="tl-filter" id="tl-filter"></div>
    <div class="tl-scroll"><div id="tl-body"></div></div>
  </div>
  <nav class="bbar">
    <button class="bitem" id="bar-home2"><span class="bic">📋</span>タスク</button>
    <button class="bitem active"><span class="bic">📰</span>タイムライン</button>
  </nav>
</div>

<!-- 設定ページ -->
<div class="page" id="pg-settings">
  <header class="hd">
    <div class="hd-top">
      <button class="hd-back" id="btn-cfg-back">← 戻る</button>
    </div>
    <div class="hd-sub">設定</div>
  </header>
  <div class="smain">
    <span class="slbl">管理</span>
    <div class="scard">
      <div class="srow" id="btn-to-fac">
        <span style="font-size:20px;">🏠</span>
        <div style="flex:1;"><div class="srlbl">施設管理</div><div class="srsub" id="fac-lbl">—</div></div>
        <span class="sarr">›</span>
      </div>
      <div class="srow" id="btn-to-staff">
        <span style="font-size:20px;">👥</span>
        <div style="flex:1;"><div class="srlbl">職員管理</div><div class="srsub" id="staff-lbl">—</div></div>
        <span class="sarr">›</span>
      </div>
      <div class="srow" id="btn-to-res">
        <span style="font-size:20px;">👤</span>
        <div style="flex:1;"><div class="srlbl">利用者管理</div><div class="srsub" id="res-lbl">—</div></div>
        <span class="sarr">›</span>
      </div>
    </div>
    <div style="text-align:center;margin-top:32px;font-size:11px;color:var(--txm);">ゆりいか タスク管理 v2.0</div>
  </div>
  <nav class="bbar">
    <button class="bitem" id="bar-home3"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl3"><span class="bic">📰</span>タイムライン</button>
  </nav>
</div>

<!-- 施設管理 -->
<div class="page" id="pg-fac">
  <header class="hd">
    <div class="hd-top">
      <button class="hd-back" id="btn-fac-back">← 設定</button>
      <div class="hd-sub">施設管理</div>
      <div style="width:80px;"></div>
    </div>
  </header>
  <div class="mmain">
    <button class="add-card" id="btn-add-fac">＋ 施設を追加</button>
    <div class="mcard" id="fac-list"></div>
  </div>
  <nav class="bbar">
    <button class="bitem" id="bar-home4"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl4"><span class="bic">📰</span>タイムライン</button>
  </nav>
</div>

<!-- 職員管理 -->
<div class="page" id="pg-staff">
  <header class="hd">
    <div class="hd-top">
      <button class="hd-back" id="btn-staff-back">← 設定</button>
      <div class="hd-sub">職員管理</div>
      <div style="width:80px;"></div>
    </div>
  </header>
  <div class="mmain">
    <button class="add-card" id="btn-add-staff">＋ 職員を追加</button>
    <div class="mcard" id="staff-list"></div>
  </div>
  <nav class="bbar">
    <button class="bitem" id="bar-home5"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl5"><span class="bic">📰</span>タイムライン</button>
  </nav>
</div>

<!-- 利用者管理 -->
<div class="page" id="pg-res">
  <header class="hd">
    <div class="hd-top">
      <button class="hd-back" id="btn-res-back">← 設定</button>
      <div class="hd-sub">利用者管理</div>
      <div style="width:80px;"></div>
    </div>
  </header>
  <div class="mmain">
    <button class="add-card" id="btn-add-res">＋ 利用者を追加</button>
    <div class="mcard" id="res-list"></div>
  </div>
  <nav class="bbar">
    <button class="bitem" id="bar-home6"><span class="bic">📋</span>タスク</button>
    <button class="bitem" id="bar-tl6"><span class="bic">📰</span>タイムライン</button>
  </nav>
</div>

<!-- MODAL: タスク -->
<div class="ov" id="ov-task">
  <div class="sheet">
    <div class="knob"></div>
    <div class="stitle" id="task-ttl">タスクを追加</div>
    <div class="fg">
      <label class="fl">登録日</label>
      <div class="date-wrap">
        <div class="date-disp" id="t-date-disp"></div>
        <input type="date" class="date-input-hidden" id="t-date">
      </div>
    </div>
    <div class="fg">
      <label class="fl">施設</label>
      <select class="fs" id="t-fac"></select>
    </div>
    <div class="fg">
      <label class="fl">利用者（任意）</label>
      <select class="fs" id="t-res"></select>
    </div>
    <div class="fg">
      <label class="fl">対応者（任意）</label>
      <select class="fs" id="t-staff"></select>
    </div>
    <div class="fg">
      <label class="fl">内容</label>
      <textarea class="fta" id="t-txt" placeholder="タスク内容を入力…"></textarea>
    </div>
    <div class="fg">
      <label class="fl">ステータス</label>
      <select class="fs" id="t-tag">
        <option value="todo">未着手</option>
        <option value="wip">対応中</option>
        <option value="done">対応済み</option>
      </select>
    </div>
    <div class="mact">
      <button class="bcnl" id="task-cnl">キャンセル</button>
      <button class="bsav" id="task-sav">保 存</button>
    </div>
  </div>
</div>

<!-- MODAL: タスク詳細 -->
<div class="ov" id="ov-detail">
  <div class="sheet">
    <div class="knob"></div>
    <div class="stitle" id="detail-ttl"></div>
    <div id="detail-body" style="font-size:14px;line-height:1.9;white-space:pre-wrap;margin-bottom:20px;"></div>
    <div class="mact">
      <button class="bdel" id="detail-del">削 除</button>
      <button class="bsav" data-action="edit-task" style="flex:1.5;">編 集</button>
      <button class="bcnl" id="detail-cnl">閉じる</button>
    </div>
  </div>
</div>

<!-- MODAL: 施設 -->
<div class="ov" id="ov-fac">
  <div class="sheet">
    <div class="knob"></div>

<script>
(function(){
'use strict';

/* ══ Firebase ══ */
var firebaseConfig = {
  apiKey: "AIzaSyB-D90f-72b0lV2g0Ue6yc3-o30MBn6v0w",
  authDomain: "task-6e73b.firebaseapp.com",
  projectId: "task-6e73b",
  storageBucket: "task-6e73b.firebasestorage.app",
  messagingSenderId: "66320987902",
  appId: "1:66320987902:web:90a2cebd6c2d34661817af"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

function setDbStatus(ok){
  var dot=document.getElementById('db-dot');
  var lbl=document.getElementById('db-status');
  if(!dot||!lbl) return;
  if(ok){
    dot.className='db-dot connected';
    lbl.textContent='データベース接続済み';
  } else {
    dot.className='db-dot disconnected';
    lbl.textContent='オフライン動作中';
  }
}

/* ══ ローカルストレージ ══ */
var _mem={};
var ST={
  get:function(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return _mem[k]||null;}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}_mem[k]=v;}
};
var K={fac:'tt-fac',staff:'tt-staff',res:'tt-res',task:'tt-task'};

/* ══ 初期データ ══ */
function initData(){
  if(!ST.get(K.fac)) ST.set(K.fac,[
    {id:'all', name:'会社全体',order:0},
    {id:'h1',  name:'ハイム１',order:1},
    {id:'h2',  name:'ハイム２',order:2},
    {id:'soka',name:'草加駅前',order:3}
  ]);
  if(!ST.get(K.staff)) ST.set(K.staff,[]);
  if(!ST.get(K.res))   ST.set(K.res,[]);
  if(!ST.get(K.task))  ST.set(K.task,[]);
}
function getFacs()  {return (ST.get(K.fac)||[]).sort(function(a,b){return a.order-b.order;});}
function getStaff() {return (ST.get(K.staff)||[]).sort(function(a,b){return (a.order||0)-(b.order||0);});}
function getRes()   {return (ST.get(K.res)||[]).sort(function(a,b){return (a.order||0)-(b.order||0);});}
function getTasks() {return ST.get(K.task)||[];}

/* ══ Firebase CRUD ══ */
function fetchTasksFromDB(cb){
  db.collection('tasks').orderBy('createdAt','desc').get()
    .then(function(snap){
      var tasks=[];
      snap.forEach(function(doc){tasks.push(Object.assign({id:doc.id},doc.data()));});
      ST.set(K.task,tasks);
      setDbStatus(true);
      if(cb) cb(tasks);
    })
    .catch(function(err){
      console.warn('Firebase取得失敗:',err);
      setDbStatus(false);
      if(cb) cb(getTasks());
    });
}
function saveTaskToDB(t,cb){
  var facs=getFacs(),staff=getStaff(),ress=getRes();
  var fac=facs.find(function(f){return f.id===t.fid;});
  var s=t.staffId?staff.find(function(x){return x.id===t.staffId;}):null;
  var r=t.resId?ress.find(function(x){return x.id===t.resId;}):null;
  var data={
    fid:t.fid, facName:fac?fac.name:'',
    resId:t.resId||null, resName:r?r.name:'',
    date:t.date, text:t.text, tag:t.tag,
    staffId:t.staffId||null, staffName:s?s.name:'',
    createdAt:t.createdAt
  };
  db.collection('tasks').doc(t.id).set(data)
    .then(function(){setDbStatus(true);if(cb)cb(true);})
    .catch(function(err){console.warn('保存失敗:',err);if(cb)cb(false);});
}
function deleteTaskFromDB(id,cb){
  db.collection('tasks').doc(id).delete()
    .then(function(){if(cb)cb(true);})
    .catch(function(err){console.warn('削除失敗:',err);if(cb)cb(false);});
}

/* ══ ユーティリティ ══ */
var DOW=['日','月','火','水','木','金','土'];
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return n<10?'0'+n:''+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtD(s){if(!s)return '';var p=s.split('-');var d=new Date(s+'T00:00:00');return parseInt(p[1])+'月'+parseInt(p[2])+'日（'+DOW[d.getDay()]+'）';}
function fmtDFull(s){var d=new Date(s+'T00:00:00');return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+DOW[d.getDay()]+'）';}
function tagLabel(t){return {todo:'未着手',wip:'対応中',done:'対応済み'}[t]||t;}
function tagCls(t){return {todo:'t-todo',wip:'t-wip',done:'t-done'}[t]||'t-todo';}

function updateDateDisp(){
  var v=document.getElementById('t-date').value;
  var el=document.getElementById('t-date-disp');
  if(!v){el.textContent='';return;}
  var d=new Date(v+'T00:00:00'),dow=d.getDay();
  var p=v.split('-');
  var cls=dow===0?'dow-sun':dow===6?'dow-sat':'dow-wk';
  el.innerHTML=esc(p[0]+'/'+p[1]+'/'+p[2])+'<span class="'+cls+'">（'+DOW[dow]+'）</span>';
}

var ICONS=['c0','c1','c2','c3','c4','c5'];

/* ══ ページ切り替え ══ */
function showPage(id){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});
  document.getElementById(id).classList.add('active');
  ({
    'pg-home':    renderHome,
    'pg-tl':      renderTimeline,
    'pg-settings':renderSettings,
    'pg-fac':     renderFac,
    'pg-staff':   renderStaff,
    'pg-res':     renderRes
  }[id]||function(){})();
}

/* ══ モーダル ══ */
function openOv(id){document.getElementById(id).classList.add('open');}
function closeOv(id){document.getElementById(id).classList.remove('open');}
var _cfmCb=null;
function confirm2(msg,cb){
  document.getElementById('cfm-msg').textContent=msg;
  _cfmCb=cb; openOv('ov-cfm');
}

/* ══ トップページ ══ */
function renderHome(){
  var now=new Date(),dow=now.getDay();
  document.getElementById('todayBadge').textContent=(now.getMonth()+1)+'月'+now.getDate()+'日（'+DOW[dow]+'）';
  var cont=document.getElementById('homeMain');
  cont.innerHTML='<div style="padding:40px;text-align:center;color:var(--txm);font-size:13px;">📡 読み込み中…</div>';

  fetchTasksFromDB(function(tasks){
    var active=tasks.filter(function(t){return t.tag!=='done';}).length;
    document.getElementById('taskSumm').textContent='未完了 '+active+'件';
    var facs=getFacs(),staff=getStaff(),ress=getRes();
    cont.innerHTML='';
    facs.forEach(function(fac,fi){
      var facTasks=tasks.filter(function(t){return t.fid===fac.id;});
      var card=document.createElement('div');
      card.className='sec-card';
      var listHTML='<button class="add-s" data-action="add-task" data-fid="'+fac.id+'">＋ タスクを追加</button>';
      if(facTasks.length){
        listHTML+=facTasks.map(function(t){
          var s=t.staffId?staff.find(function(x){return x.id===t.staffId;}):null;
          var r=t.resId?ress.find(function(x){return x.id===t.resId;}):null;
          var sName=s?s.name:(t.staffName||'');
          var rName=r?r.name:(t.resName||'');
          return '<div class="ti" data-action="detail" data-id="'+t.id+'">'+
            '<div class="ti-body">'+
              '<div class="ti-txt">'+esc(t.text)+'</div>'+
              '<div class="ti-meta">'+
                '<span class="tag '+tagCls(t.tag)+'">'+tagLabel(t.tag)+'</span>'+
                (rName?'<span class="ti-res">'+esc(rName)+'</span>':'')+
                (sName?'<span class="ti-assignee">'+esc(sName)+'</span>':'')+
                '<span class="ti-date">'+fmtD(t.date)+'</span>'+
              '</div>'+
            '</div>'+
          '</div>';
        }).join('');
      } else {
        listHTML+='<div class="empty">タスクはありません</div>';
      }
      card.innerHTML=
        '<div class="sec-hd" data-toggle-sec>'+
          '<div class="sec-ic '+ICONS[fi%ICONS.length]+'">🏢</div>'+
          '<div class="sec-ttl">'+esc(fac.name)+'</div>'+
          '<div class="sec-cnt">'+facTasks.length+'件</div>'+
          '<div class="chev">▾</div>'+
        '</div>'+
        '<div class="sec-bd">'+listHTML+'</div>';
      cont.appendChild(card);
    });
  });
}

/* ══ タイムライン ══ */
var _tlFilter='all';
function renderTimeline(){
  var facs=getFacs(),staff=getStaff(),ress=getRes();
  var tasks=getTasks();
  var chips=[{id:'all',name:'すべて'}].concat(facs);
  document.getElementById('tl-filter').innerHTML=chips.map(function(f){
    return '<button class="tl-chip'+(f.id===_tlFilter?' active':'')+'" data-action="tl-filter" data-fid="'+f.id+'">'+esc(f.name)+'</button>';
  }).join('');

  var filtered=tasks.filter(function(t){return _tlFilter==='all'||t.fid===_tlFilter;})
    .sort(function(a,b){return b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||'');});

  var bodyEl=document.getElementById('tl-body');
  if(!filtered.length){bodyEl.innerHTML='<div class="tl-empty">📭 タスクがまだありません</div>';return;}

  var groups={},gOrder=[];
  filtered.forEach(function(t){
    if(!groups[t.date]){groups[t.date]=[];gOrder.push(t.date);}
    groups[t.date].push(t);
  });

  bodyEl.innerHTML=gOrder.map(function(date){
    var items=groups[date].map(function(t){
      var fac=facs.find(function(f){return f.id===t.fid;});
      var s=t.staffId?staff.find(function(x){return x.id===t.staffId;}):null;
      var r=t.resId?ress.find(function(x){return x.id===t.resId;}):null;
      var sName=s?s.name:(t.staffName||'');
      var rName=r?r.name:(t.resName||'');
      var who=rName||sName||(fac?fac.name:'—');
      return '<div class="tl-item status-'+t.tag+'" data-action="detail" data-id="'+t.id+'">'+
        '<div class="tl-item-hd">'+
          '<div class="tl-who">'+esc(who)+'</div>'+
          (fac?'<div class="tl-fac">'+esc(fac.name)+'</div>':'')+
          '<span class="tag '+tagCls(t.tag)+'">'+tagLabel(t.tag)+'</span>'+
        '</div>'+
        '<div class="tl-txt">'+esc(t.text)+'</div>'+
      '</div>';
    }).join('');
    return '<div class="tl-day">'+
      '<div class="tl-day-lbl"><span class="tl-day-txt">'+fmtDFull(date)+'</span></div>'+
      items+'</div>';
  }).join('');
}

/* ══ タスクモーダル ══ */
var _editTaskId=null;
function openTaskModal(facId){
  _editTaskId=null;
  document.getElementById('task-ttl').textContent='タスクを追加';
  document.getElementById('t-date').value=todayStr();
  updateDateDisp();
  document.getElementById('t-txt').value='';
  document.getElementById('t-tag').value='todo';
  var facs=getFacs();
  document.getElementById('t-fac').innerHTML=facs.map(function(f){
    return '<option value="'+f.id+'"'+(f.id===facId?' selected':'')+'>'+esc(f.name)+'</option>';
  }).join('');
  updateResSelect(facId,null);
  updateStaffSelect(null);
  openOv('ov-task');
  setTimeout(function(){document.getElementById('t-txt').focus();},350);
}

function updateResSelect(facId,preselectId){
  var ress=getRes().filter(function(r){return r.fid===facId;});
  var sel=document.getElementById('t-res');
  sel.innerHTML='<option value="">なし</option>'+
    ress.map(function(r){return '<option value="'+r.id+'"'+(r.id===preselectId?' selected':'')+'>'+esc(r.name)+'</option>';}).join('');
}
function updateStaffSelect(preselectId){
  var staff=getStaff();
  document.getElementById('t-staff').innerHTML='<option value="">未定</option>'+
    staff.map(function(s){return '<option value="'+s.id+'"'+(s.id===preselectId?' selected':'')+'>'+esc(s.name)+'</option>';}).join('');
}

function saveTask(){
  var txt=document.getElementById('t-txt').value.trim();
  if(!txt){alert('内容を入力してください');return;}
  var tasks=getTasks();
  var t={
    id:_editTaskId||uid(),
    fid:document.getElementById('t-fac').value,
    resId:document.getElementById('t-res').value||null,
    date:document.getElementById('t-date').value,
    text:txt,
    tag:document.getElementById('t-tag').value,
    staffId:document.getElementById('t-staff').value||null,
    createdAt:new Date().toISOString()
  };
  if(_editTaskId){
    var idx=tasks.findIndex(function(x){return x.id===_editTaskId;});
    if(idx>=0) tasks[idx]=t; else tasks.push(t);
  } else { tasks.push(t); }
  ST.set(K.task,tasks);
  closeOv('ov-task');
  renderHome();
  saveTaskToDB(t,function(ok){if(!ok) console.warn('DB保存失敗');});
}

/* ══ 詳細モーダル ══ */
var _detailId=null;
function openDetail(id){
  var t=getTasks().find(function(x){return x.id===id;});
  if(!t) return;
  _detailId=id;
  var fac=getFacs().find(function(f){return f.id===t.fid;});
  var s=t.staffId?getStaff().find(function(x){return x.id===t.staffId;}):null;
  var r=t.resId?getRes().find(function(x){return x.id===t.resId;}):null;
  var sName=s?s.name:(t.staffName||'');
  var rName=r?r.name:(t.resName||'');
  document.getElementById('detail-ttl').textContent=fac?fac.name:'';
  document.getElementById('detail-body').textContent=
    fmtDFull(t.date)+
    '\nステータス：'+tagLabel(t.tag)+
    (rName?'\n利用者：'+rName:'')+
    (sName?'\n対応者：'+sName:'')+
    '\n\n'+t.text;
  openOv('ov-detail');
}
function openEditTask(){
  var t=getTasks().find(function(x){return x.id===_detailId;});
  if(!t) return;
  closeOv('ov-detail');
  _editTaskId=t.id;
  document.getElementById('task-ttl').textContent='タスクを編集';
  document.getElementById('t-date').value=t.date;
  updateDateDisp();
  document.getElementById('t-txt').value=t.text;
  document.getElementById('t-tag').value=t.tag;
  var facs=getFacs();
  document.getElementById('t-fac').innerHTML=facs.map(function(f){
    return '<option value="'+f.id+'"'+(f.id===t.fid?' selected':'')+'>'+esc(f.name)+'</option>';
  }).join('');
  updateResSelect(t.fid,t.resId);
  updateStaffSelect(t.staffId);
  openOv('ov-task');
}

/* ══ 設定 ══ */
function renderSettings(){
  document.getElementById('fac-lbl').textContent='施設 '+getFacs().length+'件';
  document.getElementById('staff-lbl').textContent='職員 '+getStaff().length+'名';
  document.getElementById('res-lbl').textContent='利用者 '+getRes().length+'名';
}

/* ══ 施設管理 ══ */
var _editFacId=null;
function renderFac(){
  var facs=getFacs();
  var el=document.getElementById('fac-list');
  if(!facs.length){el.innerHTML='<div class="empty-page">施設が登録されていません</div>';return;}
  el.innerHTML=facs.map(function(f){
    var isG=f.id==='all';
    return '<div class="mitem" data-id="'+f.id+'">'+
      '<div class="dh"><span></span><span></span><span></span></div>'+
      '<span style="font-size:20px;flex-shrink:0;">🏢</span>'+
      '<div class="mibody"><div class="minm">'+esc(f.name)+'</div>'+
      '<div class="misub">'+(isG?'全社共通（削除不可）':'')+'</div></div>'+
      '<div class="miact">'+
        '<button class="abtn aedt" data-action="edit-fac" data-id="'+f.id+'">✏️</button>'+
        (isG?'':'<button class="abtn adel" data-action="del-fac" data-id="'+f.id+'">🗑</button>')+
      '</div></div>';
  }).join('');
  makeSortable(el,function(ids){
    var facs2=getFacs();
    ST.set(K.fac,ids.map(function(id,i){var f=facs2.find(function(x){return x.id===id;});return f?Object.assign({},f,{order:i}):null;}).filter(Boolean));
  });
}
function openFacModal(facId){
  _editFacId=facId;
  var fac=facId?getFacs().find(function(f){return f.id===facId;}):null;
  document.getElementById('fac-ttl').textContent=fac?'施設を編集':'施設を追加';
  document.getElementById('f-name').value=fac?fac.name:'';
  openOv('ov-fac');
  setTimeout(function(){document.getElementById('f-name').focus();},300);
}
function saveFac(){
  var name=document.getElementById('f-name').value.trim();
  if(!name){alert('施設名を入力してください');return;}
  var facs=getFacs();
  if(_editFacId){facs=facs.map(function(f){return f.id===_editFacId?Object.assign({},f,{name:name}):f;});}
  else{facs.push({id:uid(),name:name,order:facs.length});}
  ST.set(K.fac,facs);
  closeOv('ov-fac'); renderFac(); renderSettings();
}
function delFac(facId){
  var cnt=getTasks().filter(function(t){return t.fid===facId;}).length;
  confirm2(cnt?'この施設を削除するとタスク '+cnt+'件も削除されます。\n本当に削除しますか？':'この施設を削除しますか？',function(){
    ST.set(K.fac,getFacs().filter(function(f){return f.id!==facId;}));
    ST.set(K.res,getRes().filter(function(r){return r.fid!==facId;}));
    ST.set(K.task,getTasks().filter(function(t){return t.fid!==facId;}));
    renderFac(); renderSettings();
  });
}

/* ══ 職員管理 ══ */
var _editStaffId=null;
function renderStaff(){
  var staff=getStaff();
  var el=document.getElementById('staff-list');
  if(!staff.length){el.innerHTML='<div class="empty-page">職員が登録されていません</div>';return;}
  el.innerHTML=staff.map(function(s){
    return '<div class="mitem" data-id="'+s.id+'">'+
      '<div class="dh"><span></span><span></span><span></span></div>'+
      '<span style="font-size:20px;flex-shrink:0;">👤</span>'+
      '<div class="mibody"><div class="minm">'+esc(s.name)+'</div></div>'+
      '<div class="miact">'+
        '<button class="abtn aedt" data-action="edit-staff" data-id="'+s.id+'">✏️</button>'+
        '<button class="abtn adel" data-action="del-staff" data-id="'+s.id+'">🗑</button>'+
      '</div></div>';
  }).join('');
  makeSortable(el,function(ids){
    var staff2=getStaff();
    ST.set(K.staff,ids.map(function(id,i){var s=staff2.find(function(x){return x.id===id;});return s?Object.assign({},s,{order:i}):null;}).filter(Boolean));
  });
}
function openStaffModal(staffId){
  _editStaffId=staffId;
  var s=staffId?getStaff().find(function(x){return x.id===staffId;}):null;
  document.getElementById('staff-ttl').textContent=s?'職員を編集':'職員を追加';
  document.getElementById('s-name').value=s?s.name:'';
  openOv('ov-staff');
  setTimeout(function(){document.getElementById('s-name').focus();},300);
}
function saveStaff(){
  var name=document.getElementById('s-name').value.trim();
  if(!name){alert('氏名を入力してください');return;}
  var staff=getStaff();
  if(_editStaffId){staff=staff.map(function(s){return s.id===_editStaffId?Object.assign({},s,{name:name}):s;});}
  else{staff.push({id:uid(),name:name,order:staff.length});}
  ST.set(K.staff,staff);
  closeOv('ov-staff'); renderStaff(); renderSettings();
}
function delStaff(staffId){
  var s=getStaff().find(function(x){return x.id===staffId;});
  if(!s) return;
  confirm2('「'+s.name+'」を削除しますか？',function(){
    ST.set(K.staff,getStaff().filter(function(x){return x.id!==staffId;}));
    renderStaff(); renderSettings();
  });
}

/* ══ 利用者管理 ══ */
var _editResId=null;
function renderRes(){
  var ress=getRes(),facs=getFacs();
  var el=document.getElementById('res-list');
  if(!ress.length){el.innerHTML='<div class="empty-page">利用者が登録されていません</div>';return;}
  el.innerHTML=ress.map(function(r){
    var fac=facs.find(function(f){return f.id===r.fid;});
    return '<div class="mitem" data-id="'+r.id+'">'+
      '<div class="dh"><span></span><span></span><span></span></div>'+
      '<span style="font-size:20px;flex-shrink:0;">🏠</span>'+
      '<div class="mibody">'+
        '<div class="minm">'+esc(r.name)+'</div>'+
        '<div class="misub">'+(fac?esc(fac.name):'未配属')+'</div>'+
      '</div>'+
      '<div class="miact">'+
        '<button class="abtn aedt" data-action="edit-res" data-id="'+r.id+'">✏️</button>'+
        '<button class="abtn adel" data-action="del-res" data-id="'+r.id+'">🗑</button>'+
      '</div></div>';
  }).join('');
  makeSortable(el,function(ids){
    var ress2=getRes();
    ST.set(K.res,ids.map(function(id,i){var r=ress2.find(function(x){return x.id===id;});return r?Object.assign({},r,{order:i}):null;}).filter(Boolean));
  });
}
function openResModal(resId){
  _editResId=resId;
  var r=resId?getRes().find(function(x){return x.id===resId;}):null;
  document.getElementById('res-ttl').textContent=r?'利用者を編集':'利用者を追加';
  document.getElementById('r-name').value=r?r.name:'';
  var facs=getFacs().filter(function(f){return f.id!=='all';});
  document.getElementById('r-fac').innerHTML=
    '<option value="">未配属</option>'+
    facs.map(function(f){return '<option value="'+f.id+'"'+(r&&r.fid===f.id?' selected':'')+'>'+esc(f.name)+'</option>';}).join('');
  openOv('ov-res');
  setTimeout(function(){document.getElementById('r-name').focus();},300);
}
function saveRes(){
  var name=document.getElementById('r-name').value.trim();
  if(!name){alert('氏名を入力してください');return;}
  var fid=document.getElementById('r-fac').value||null;
  var ress=getRes();
  if(_editResId){ress=ress.map(function(r){return r.id===_editResId?Object.assign({},r,{name:name,fid:fid}):r;});}
  else{ress.push({id:uid(),name:name,fid:fid,order:ress.length});}
  ST.set(K.res,ress);
  closeOv('ov-res'); renderRes(); renderSettings();
}
function delRes(resId){
  var r=getRes().find(function(x){return x.id===resId;});
  if(!r) return;
  confirm2('「'+r.name+'」を削除しますか？',function(){
    ST.set(K.res,getRes().filter(function(x){return x.id!==resId;}));
    renderRes(); renderSettings();
  });
}

/* ══ ドラッグソート ══ */
function makeSortable(container,onReorder){
  var dragging=null;
  function items(){return Array.from(container.querySelectorAll(':scope > .mitem'));}
  function clear(){items().forEach(function(el){el.classList.remove('dragging','over-top','over-bot');});}
  function onMove(clientY){
    if(!dragging) return;
    var list=items().filter(function(el){return el!==dragging;});
    clear(); dragging.classList.add('dragging');
    var placed=false;
    for(var i=0;i<list.length;i++){
      var r=list[i].getBoundingClientRect();
      if(clientY<r.top+r.height*0.5){container.insertBefore(dragging,list[i]);placed=true;break;}
    }
    if(!placed&&list.length) container.appendChild(dragging);
  }
  function onEnd(){
    if(!dragging) return;
    clear();
    onReorder(items().map(function(el){return el.dataset.id;}));
    dragging=null;
  }
  function attach(handle){
    handle.addEventListener('touchstart',function(e){
      e.stopPropagation();e.preventDefault();
      dragging=handle.closest('.mitem');dragging.classList.add('dragging');
      function mv(ev){ev.preventDefault();onMove(ev.touches[0].clientY);}
      function en(){onEnd();document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',en);}
      document.addEventListener('touchmove',mv,{passive:false});
      document.addEventListener('touchend',en);
    },{passive:false});
    handle.addEventListener('mousedown',function(e){
      e.stopPropagation();e.preventDefault();
      dragging=handle.closest('.mitem');dragging.classList.add('dragging');
      function mv(ev){onMove(ev.clientY);}
      function en(){onEnd();document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',en);}
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',en);
    });
  }
  container.querySelectorAll(':scope > .mitem > .dh').forEach(attach);
}

/* ══ クリック委任 ══ */
document.addEventListener('click',function(e){
  if(e.target.classList.contains('ov')){e.target.classList.remove('open');return;}
  var secHd=e.target.closest('[data-toggle-sec]');
  if(secHd){secHd.closest('.sec-card').classList.toggle('open');return;}
  var btn=e.target.closest('[data-action]');
  if(!btn) return;
  var act=btn.dataset.action,id=btn.dataset.id||'';
  if(act==='add-task')   {openTaskModal(btn.dataset.fid);return;}
  if(act==='detail')     {openDetail(id);return;}
  if(act==='edit-task')  {openEditTask();return;}
  if(act==='edit-fac')   {openFacModal(id);return;}
  if(act==='del-fac')    {delFac(id);return;}
  if(act==='edit-staff') {openStaffModal(id);return;}
  if(act==='del-staff')  {delStaff(id);return;}
  if(act==='edit-res')   {openResModal(id);return;}
  if(act==='del-res')    {delRes(id);return;}
  if(act==='tl-filter')  {_tlFilter=btn.dataset.fid;renderTimeline();return;}
});
